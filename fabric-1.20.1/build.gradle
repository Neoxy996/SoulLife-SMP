plugins {
    id 'fabric-loom' version '1.7.+'
    id 'java'
    id 'maven-publish'
}

group = 'com.soullife'
version = '1.1.0'
archivesBaseName = 'SoulLife-fabric-1.20.1'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://api.modrinth.com/maven' }
    maven { url 'https://maven.twelveiterations.com/repository/maven-public/' }
}

dependencies {
    minecraft "com.mojang:minecraft:1.20.1"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:0.15.11"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.92.0+1.20.1"
    modImplementation("net.blay09.mods:balm-fabric:7.3.43+1.20.1") {
        transitive = false
    }
}

sourceSets.main {
    java.srcDirs   += ['../common/src/main/java']
    resources.srcDirs += ['../common/src/main/resources']
}

jar {
    duplicatesStrategy = 'exclude'
    from("src/main/resources") {
        include "fabric.mod.json"
    }
    exclude 'META-INF/**'
}
