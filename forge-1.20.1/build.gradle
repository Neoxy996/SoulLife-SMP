plugins {
    id 'net.minecraftforge.gradle' version '6.+'
    id 'java'
    id 'maven-publish'
}

group = 'com.soullife'
version = '1.0.0'
archivesBaseName = 'SoulLife-forge-1.20.1'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client { workingDirectory project.file('run') }
        server { workingDirectory project.file('run') }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
}

sourceSets.main {
    java.srcDirs   += ['../common/src/main/java']
    resources.srcDirs += ['../common/src/main/resources']
}

jar {
    manifest {
        attributes([
            'Specification-Title'  : 'soullife',
            'Implementation-Version': project.version,
            'MixinConfigs'         : ''
        ])
    }
}
