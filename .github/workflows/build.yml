name: Build SoulLife SMP

on:
  push:
    branches: [ main, dev, 1.20.1 ]
  pull_request:
    branches: [ main, dev, 1.20.1 ]
  release:
    types: [ created ]
  workflow_dispatch:  

jobs:

  build-forge:
    name: Build Forge 1.20.1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Build Forge
        run: ./gradlew :forge-1.20.1:build -x test --no-daemon

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SoulLife-SMP-Forge-1.20.1
          path: forge-1.20.1/build/libs/SoulLife-SMP-*.jar
          retention-days: 5

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: forge-build-logs
          path: forge-1.20.1/build/
          retention-days: 3

  build-fabric:
    name: Build Fabric 1.20.1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Build Fabric
        run: ./gradlew :fabric-1.20.1:build -x test --no-daemon

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SoulLife-SMP-Fabric-1.20.1
          path: fabric-1.20.1/build/libs/SoulLife-SMP-*.jar
          retention-days: 5

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-build-logs
          path: fabric-1.20.1/build/
          retention-days: 3

  release:
    name: Release All JARs
    runs-on: ubuntu-latest
    needs: [build-forge, build-fabric]
    if: github.event_name == 'release'
    steps:
      - name: Download Forge
        uses: actions/download-artifact@v4
        with:
          name: SoulLife-SMP-Forge-1.20.1
          path: release/

      - name: Download Fabric
        uses: actions/download-artifact@v4
        with:
          name: SoulLife-SMP-Fabric-1.20.1
          path: release/

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
