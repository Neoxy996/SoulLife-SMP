name: Build SoulLife SMP

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  release:
    types: [ created ]

jobs:

  build-neoforge:
    name: Build NeoForge 1.21.1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Grant execute permission
        run: chmod +x ./gradlew
      - name: Build NeoForge
        run: ./gradlew :neoforge-1.21.1:build --no-daemon
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: SoulLife-SMP-NeoForge-1.21.1
          path: neoforge-1.21.1/build/libs/SoulLife-SMP-*.jar

  build-forge:
    name: Build Forge 1.20.1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Grant execute permission
        run: chmod +x ./gradlew
      - name: Build Forge
        run: ./gradlew :forge-1.20.1:build --no-daemon
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: SoulLife-SMP-Forge-1.20.1
          path: forge-1.20.1/build/libs/SoulLife-SMP-*.jar

  build-fabric:
    name: Build Fabric 1.20.1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle in Fabric
        run: |
          mkdir -p fabric-1.20.1/gradle/wrapper
          cp gradle/wrapper/gradle-wrapper.jar fabric-1.20.1/gradle/wrapper/
          cp gradle/wrapper/gradle-wrapper.properties fabric-1.20.1/gradle/wrapper/
      - name: Cache Gradle for Fabric
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-fabric-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-fabric-
            ${{ runner.os }}-gradle-
      - name: Cache Gradle wrapper for Fabric
        uses: actions/cache@v4
        with:
          path: fabric-1.20.1/gradle/wrapper
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
      - name: Grant execute permission
        run: chmod +x ./fabric-1.20.1/gradlew || true
      - name: Build Fabric
        run: cd fabric-1.20.1 && gradle build --no-daemon
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: SoulLife-SMP-Fabric-1.20.1
          path: fabric-1.20.1/build/libs/SoulLife-SMP-*.jar

  release:
    name: Release All JARs
    runs-on: ubuntu-latest
    needs: [build-neoforge, build-forge, build-fabric]
    if: github.event_name == 'release'
    steps:
      - name: Download NeoForge
        uses: actions/download-artifact@v4
        with:
          name: SoulLife-SMP-NeoForge-1.21.1
          path: release/
      - name: Download Forge
        uses: actions/download-artifact@v4
        with:
          name: SoulLife-SMP-Forge-1.20.1
          path: release/
      - name: Download Fabric
        uses: actions/download-artifact@v4
        with:
          name: SoulLife-SMP-Fabric-1.20.1
          path: release/
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
